name: Screenshots

# Lance le mode démo dans Chromium et met à jour les captures du README.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/screenshots.cjs
      - .github/workflows/screenshots.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the demo
        run: |
          npm ci
          npm run build

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture
        run: |
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on http://localhost:4173
          node scripts/screenshots.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/

      - name: Commit the screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || (git commit -m "Mettre à jour les captures d'écran" && git push)
